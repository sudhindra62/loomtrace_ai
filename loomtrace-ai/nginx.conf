# Nginx configuration for LoomTrace
# Place this file at: /etc/nginx/sites-available/loomtrace
# Then enable with: sudo ln -s /etc/nginx/sites-available/loomtrace /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

upstream loomtrace_backend {
  server 127.0.0.1:3000;
  keepalive 64;
}

# Redirect HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com www.your-domain.com;
  return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  
  server_name your-domain.com www.your-domain.com;

  # SSL certificates (from Certbot)
  ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
  
  # SSL configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  
  # Security headers (from next.config.js)
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.firebaseapp.com *.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' *.firebaseapp.com *.googleapis.com;" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

  # Client body size limit
  client_max_body_size 100M;

  # Root location
  root /app/loomtrace/public;
  index index.html index.htm;

  # Static files cache (Next.js .next/static)
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass http://loomtrace_backend;
  }

  # Public assets cache
  location /static/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # Images cache
  location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    proxy_pass http://loomtrace_backend;
  }

  # Fonts cache
  location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # API routes - no caching
  location /api/ {
    proxy_pass http://loomtrace_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # Next.js data fetching
  location ~* \.(rsc|txt)$ {
    proxy_pass http://loomtrace_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # All other requests proxy to Next.js
  location / {
    proxy_pass http://loomtrace_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Try to serve from cache first
    try_files $uri $uri.html $uri/ @backend;
  }

  # Fallback to backend
  location @backend {
    proxy_pass http://loomtrace_backend;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
  }
  location ~ ~$ {
    deny all;
  }
  location ~ (composer\.json|composer\.lock|\.env|\.git) {
    deny all;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
